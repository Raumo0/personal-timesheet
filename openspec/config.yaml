schema: governed-spec-driven

context: |
  Personal Timesheet is a local-first, cross-platform time-tracking
  application for clients, projects, tasks, inherited billing rates, weekly
  time entry, expenses, reports, and invoice-ready exports.
  The current stack is Tauri 2, Rust, React 19, TypeScript, Vite, and pnpm.
  Deliver small, runnable, independently reviewable vertical slices.
  Use test-driven development for business rules and behavior.
  Begin every new feature or material behavior change with OpenSpec Explore.
  Create a proposal only after the user approves the explored direction.
  AGENTS.md is the authoritative repository-wide working agreement.
  Governed changes keep canonical task execution evidence and reviewer reports
  under `.agentic-workflow/`; change artifacts plan those inputs but do not
  duplicate them.

rules:
  proposal:
    - Confirm that Explore concluded with explicit user agreement before creating the proposal.
    - Keep one proposal focused on one independently reviewable vertical slice.
    - State concrete non-goals whenever adjacent product scope could be inferred.
  specs:
    - Describe observable product behavior, not implementation details.
    - Include concrete scenarios for inheritance, overrides, dates, and persistence when relevant.
  design:
    - Search for existing modules, functions, types, and UI components before proposing new ones.
    - Prefer extending or reusing an existing interface over adding a parallel abstraction.
    - Keep business rules in deep modules with small, testable interfaces.
  tasks:
    - Name exact files and verification commands for each implementation task.
    - Express behavior changes as coverage-first test cycles. A passing focused
      test is sufficient evidence; expected RED evidence is optional when it
      proves a specified behavior is not yet implemented.
  validation:
    - Define deterministic validation commands, expected evidence, and manual limitations.
    - Keep canonical per-task execution evidence under `.agentic-workflow/`.
  review:
    - Define independent-review scope, validation inputs, and verdict format.
    - Keep a task checkbox unchecked until an independent APPROVED verdict.

operations:
  apply:
    guidance:
      - Use rg to search the relevant code and exports before creating a module, function, type, or UI component.
      - Keep implementation limited to the selected change and preserve unrelated user changes.
      - Run focused tests first, then the relevant build and Rust checks.
      - For `governed-spec-driven` changes, let native apply select the task, then hand execution to `implementation-loop` for validation, review, fix rounds, and the APPROVED checkbox gate.
  archive:
    guidance:
      - Verify implementation, completed tasks, and resulting main specs agree before archiving.
