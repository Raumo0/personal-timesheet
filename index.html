<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private, local-first workspace for time and expense tracking."
    />
    <title>Personal Timesheet</title>
    <style>
      :root {
        color-scheme: light;
        background: #ffffff;
      }

      :root.dark {
        color-scheme: dark;
        background: #171717;
      }
    </style>
    <script data-theme-bootstrap>
      (() => {
        const storageKey = "personal-timesheet.appearance";
        let appearance = "system";

        try {
          const stored = localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark" || stored === "system") {
            appearance = stored;
          }
        } catch {
          // Fall back to the operating-system appearance.
        }

        const systemDark =
          typeof matchMedia === "function" &&
          matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved =
          appearance === "system"
            ? systemDark
              ? "dark"
              : "light"
            : appearance;

        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolved);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
